server:
  port: 8025
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  tomcat:
    max-swallow-size: -1

spring:
  config:
    import: optional:file:.env.local[.properties]
  application:
    name: agribridge-be
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:agribridge};encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        use_nationalized_character_data: false
  messages:
    encoding: UTF-8
  sql:
    init:
      encoding: UTF-8
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

logging:
  file:
    name: logs/agribridge.log
  level:
    org.hibernate.SQL: warn
    com.agribridge: debug

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:agribridge}

ghn:
  api-base-url: ${GHN_API_BASE_URL:https://dev-online-gateway.ghn.vn}
  token: ${GHN_TOKEN:}
  shop-id: ${GHN_SHOP_ID:200136}

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  backend-public-base-url: ${APP_BACKEND_PUBLIC_BASE_URL:http://localhost:8025}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
  database:
    unicode-migration:
      enabled: ${APP_DB_UNICODE_MIGRATION_ENABLED:true}

momo:
  endpoint: ${MOMO_ENDPOINT:https://test-payment.momo.vn/v2/gateway/api}
  access-key: ${MOMO_ACCESS_KEY:mTCKt9W3eU1m39TW}
  partner-code: ${MOMO_PARTNER_CODE:MOMOLRJZ20181206}
  secret-key: ${MOMO_SECRET_KEY:SetA5RDnLHvt51AULf51DyauxUo3kDU6}

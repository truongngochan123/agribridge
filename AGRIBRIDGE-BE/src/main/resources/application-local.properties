spring.config.import=optional:file:.env.local[.properties]

spring.application.name=agribridge-be

server.port=${SERVER_PORT:8081}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-swallow-size=-1

spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:agribridge};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:true};sendStringParametersAsUnicode=true
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.properties.hibernate.use_nationalized_character_data=false
spring.messages.encoding=UTF-8
spring.sql.init.encoding=UTF-8
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}

logging.level.org.hibernate.SQL=warn

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.folder=${CLOUDINARY_FOLDER:agribridge}

ghn.api-base-url=${GHN_API_BASE_URL:https://dev-online-gateway.ghn.vn}
ghn.token=${GHN_TOKEN:}
ghn.shop-id=${GHN_SHOP_ID:200136}
ghn.default-from-province=${GHN_DEFAULT_FROM_PROVINCE:}
ghn.default-from-ward=${GHN_DEFAULT_FROM_WARD:}
ghn.default-from-address=${GHN_DEFAULT_FROM_ADDRESS:}

app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:5173}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from-address=${MAIL_FROM_ADDRESS:}
app.mail.from-name=${MAIL_FROM_NAME:AgriBridge}
app.database.unicode-migration.enabled=${APP_DB_UNICODE_MIGRATION_ENABLED:true}
